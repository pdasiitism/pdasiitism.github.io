name: Update forecast data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2,8,14,20 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install forecast dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata eccodes numpy

      - name: Fetch forecast data
        run: python scripts/update_ecmwf_forecast_data.py

      - name: Commit forecast data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update cached forecast data"
          file_pattern: "assets/data/forecast-*.json"
