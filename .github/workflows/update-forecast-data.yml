name: Update forecast data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2,8,14,20 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install forecast dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata eccodes numpy

      - name: Fetch forecast data
        run: python scripts/update_ecmwf_forecast_data.py

      - name: Stage forecast output
        run: |
          mkdir -p forecast-publish/assets/data forecast-publish/assets/forecast
          cp assets/data/forecast-*.json forecast-publish/assets/data/
          cp assets/forecast/*.png forecast-publish/assets/forecast/

      - name: Publish current forecast output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: forecast-data
          publish_dir: ./forecast-publish
          force_orphan: true
          full_commit_message: "Update current forecast output"
