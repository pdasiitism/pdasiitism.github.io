name: Update forecast data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch forecast data
        run: node scripts/update-forecast-data.mjs

      - name: Commit forecast data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update cached forecast data"
          file_pattern: "assets/data/forecast-*.json"
